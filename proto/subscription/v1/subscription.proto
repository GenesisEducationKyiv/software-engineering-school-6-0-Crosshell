syntax = "proto3";

package subscription.v1;

// SubscriptionService mirrors every REST route under /api/*. It is the
// external-facing gRPC surface — called by clients outside this system,
// with the same x-api-key authentication carried in request metadata.
service SubscriptionService {
  rpc Subscribe(SubscribeRequest) returns (SubscribeResponse);
  rpc ConfirmSubscription(ConfirmSubscriptionRequest)
      returns (ConfirmSubscriptionResponse);
  rpc Unsubscribe(UnsubscribeRequest) returns (UnsubscribeResponse);
  rpc GetSubscriptions(GetSubscriptionsRequest)
      returns (GetSubscriptionsResponse);
}

message SubscribeRequest {
  string email = 1;
  string repo = 2;
}

message SubscribeResponse {}

message ConfirmSubscriptionRequest {
  string token = 1;
}

message ConfirmSubscriptionResponse {}

message UnsubscribeRequest {
  string token = 1;
}

message UnsubscribeResponse {}

message GetSubscriptionsRequest {
  string email = 1;
}

message SubscriptionItem {
  string email = 1;
  string repo = 2;
  bool confirmed = 3;
  string last_seen_tag = 4;
}

message GetSubscriptionsResponse {
  repeated SubscriptionItem subscriptions = 1;
}
